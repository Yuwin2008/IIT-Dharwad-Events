<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IIT Dharwad Campus Events Portal</title>
    <meta name="description" content="Comprehensive portal for Indian Institute of Technology Dharwad events, technical clubs, announcements, and role-based administration." />
    <meta property="og:title" content="IIT Dharwad Campus Events Portal" />
    <meta property="og:description" content="Comprehensive portal for Indian Institute of Technology Dharwad events, technical clubs, announcements, and role-based administration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      try {
        if (localStorage.getItem('iitdh_portal_theme') === 'light') {
          document.documentElement.classList.add('theme-light');
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
        if (localStorage.getItem('iitdh_portal_viewport') === 'phone') {
          document.documentElement.classList.add('viewport-phone');
          document.documentElement.dataset.viewport = 'phone';
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-indigo-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
